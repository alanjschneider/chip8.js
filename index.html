<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Template</title>
        <style>
            html {
                height: 100%;
            }
            body {
                background-color: rgb(4, 63, 108);
                margin: 0;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            canvas {
                background-color: #000;
                border: 8px solid #222;
            }
            #container {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 16px;
            }
            #left {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            #right {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            #keyboard {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            #keyboard div {
                display: flex;
                gap: 5px;
            }
            #keyboard button {
                min-width: 50px;
                min-height: 50px;
                font-size: 1.2rem;
            }
            #actions {
                width: 100%;
                display: flex;
                gap: 8px;
            }
            #registers {
                display: flex;
            }
            #registers > div {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: #eee;
            }
            #registers .register-value,
            #pc {
                width: 25px;
                height: 20px;
                border: 1px solid #333;
                background-color: #fff;
                color: #000;
                padding: 4px;
                text-align: center;
            }
            #code {
                width: 500px;
                height: 600px;
                resize: none;
                background-color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="left">
                <div id="actions">
                    <button id="load">Load ROM</button>
                    <input id="file" type="file" accept=".ch8" hidden />
                    <button id="reset">Reset</button>
                </div>
                <canvas id="canvas" width="640px" height="320px"></canvas>
                <!-- prettier-ignore -->
                <div id="keyboard">
                    <div><button id="1">1</button><button id="2">2</button><button id="3">3</button><button id="12">C</button></div>
                    <div><button id="4">4</button><button id="5">5</button><button id="6">6</button><button id="13">D</button></div>
                    <div><button id="7">7</button><button id="8">8</button><button id="9">9</button><button id="14">E</button></div>
                    <div><button id="10">A</button><button id="0">0</button><button id="11">B</button><button id="15">F</button></div>
                </div>
            </div>
